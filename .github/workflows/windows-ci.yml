name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Resolve application version
        shell: pwsh
        run: |
          $version = (python -c "import dds_companion; print(dds_companion.__version__)").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Application version must be final semver, got: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validating DDS Companion $version"

      - name: Regression suite
        timeout-minutes: 12
        run: python -m unittest discover -s dds_companion/tests -p "test_*.py"

      - name: Compile and verify application version
        shell: pwsh
        run: |
          python -m compileall -q dds_companion dds_companion_patchxx.py
          $version = (python -m dds_companion.app --version).Trim()
          Write-Host $version
          if ($version -ne "DDS Companion $env:VERSION") {
            throw "Unexpected application version: $version"
          }

      - name: Build native Windows distribution
        timeout-minutes: 12
        shell: pwsh
        run: |
          cmd /c build_windows.bat
          if ($LASTEXITCODE -ne 0) {
            throw "build_windows.bat failed with exit code $LASTEXITCODE"
          }

      - name: Verify Windows distribution and packages
        shell: pwsh
        run: |
          $root = "dist/DDS"
          $app = "$root/versions/$env:VERSION/DDSApp.exe"
          $launcher = "$root/DDS.exe"
          $updater = "$root/DDSUpdater.exe"

          foreach ($exe in @($launcher, $updater, $app)) {
            if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
            $info = (Get-Item $exe).VersionInfo
            Write-Host "$exe FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
            if ($info.FileVersion -ne $env:VERSION) { throw "Unexpected FileVersion: $exe" }
            if ($info.ProductVersion -ne $env:VERSION) { throw "Unexpected ProductVersion: $exe" }
          }

          $current = Get-Content "$root/current.json" -Raw | ConvertFrom-Json
          if ($current.version -ne $env:VERSION) { throw "Unexpected current pointer" }

          $full = "dist/release/DDS-$env:VERSION-windows-x64.zip"
          $update = "dist/release/DDS-$env:VERSION-update.zip"
          $manifestPath = "dist/release/DDS-$env:VERSION-update.json"
          foreach ($path in @($full, $update, $manifestPath, "$full.sha256", "$update.sha256")) {
            if (-not (Test-Path $path)) { throw "Missing release artifact: $path" }
          }

          python -m zipfile -t $full
          if ($LASTEXITCODE -ne 0) { throw "Full ZIP integrity test failed" }
          python -m zipfile -t $update
          if ($LASTEXITCODE -ne 0) { throw "Update ZIP integrity test failed" }

          $fullHash = (Get-FileHash $full -Algorithm SHA256).Hash.ToLower()
          $updateHash = (Get-FileHash $update -Algorithm SHA256).Hash.ToLower()
          $fullExpected = ((Get-Content "$full.sha256" -Raw).Trim() -split "\s+")[0].ToLower()
          $updateExpected = ((Get-Content "$update.sha256" -Raw).Trim() -split "\s+")[0].ToLower()
          if ($fullHash -ne $fullExpected) { throw "Full ZIP SHA-256 mismatch" }
          if ($updateHash -ne $updateExpected) { throw "Update ZIP SHA-256 mismatch" }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw "Unexpected update manifest version" }
          if ($manifest.channel -ne "stable") { throw "Unexpected update manifest channel" }
          if ($manifest.asset -ne "DDS-$env:VERSION-update.zip") { throw "Unexpected update asset" }
          if ($manifest.sha256.ToLower() -ne $updateHash) { throw "Manifest SHA-256 mismatch" }
          if ([int64]$manifest.size_bytes -ne (Get-Item $update).Length) { throw "Manifest size mismatch" }

      - name: Upload validated Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DDS-windows-x64
          path: |
            dist/release/DDS-*-windows-x64.zip
            dist/release/DDS-*-windows-x64.zip.sha256
            dist/release/DDS-*-update.zip
            dist/release/DDS-*-update.zip.sha256
            dist/release/DDS-*-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload manual-test Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: DDS-manual-test
          path: dist/DDS/**
          if-no-files-found: error
          retention-days: 14
