name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Focused Windows regressions
        timeout-minutes: 8
        shell: pwsh
        run: |
          python -m unittest -v `
            dds_companion.tests.test_observability.ObservabilityTests.test_health_reports_core_subsystems `
            dds_companion.tests.test_observability.ObservabilityTests.test_last_error_info_has_subsystem_and_clears_after_recovery `
            dds_companion.tests.test_observability.ObservabilityTests.test_runtime_monitor_degrades_then_recovers_importer `
            dds_companion.tests.test_observability.ObservabilityTests.test_plugin_053_running_stopped_and_stale_heartbeat `
            dds_companion.tests.test_gui_foundation.GuiRuntimeTests.test_runtime_emits_real_snapshot_and_stops_cleanly `
            dds_companion.tests.test_gui_foundation.GuiRuntimeTests.test_runtime_serves_library_pages_and_persists_export_rule

      - name: Regression pass 1 of 3
        timeout-minutes: 8
        run: python -m unittest discover -s dds_companion/tests -p "test_*.py"

      - name: Regression pass 2 of 3
        timeout-minutes: 8
        run: python -m unittest discover -s dds_companion/tests -p "test_*.py"

      - name: Regression pass 3 of 3
        timeout-minutes: 8
        run: python -m unittest discover -s dds_companion/tests -p "test_*.py"

      - name: Compile and verify application version
        shell: pwsh
        run: |
          python -m compileall -q dds_companion
          $version = python -m dds_companion.app --version
          Write-Host $version
          if ($version -notmatch "0\.6\.2") {
            throw "Unexpected application version: $version"
          }

      - name: Build native Windows onedir
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm DDS.spec
          if (-not (Test-Path "dist/DDS/DDS.exe")) {
            throw "dist/DDS/DDS.exe was not produced"
          }

      - name: Verify and package DDS.exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/DDS/DDS.exe").Path
          $info = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion=$($info.FileVersion)"
          Write-Host "ProductVersion=$($info.ProductVersion)"
          if ($info.FileVersion -notlike "0.6.2*") {
            throw "Unexpected DDS.exe FileVersion: $($info.FileVersion)"
          }

          $zip = "DDS-0.6.2-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/DDS/*" -DestinationPath $zip -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq "DDS.exe" })) {
              throw "DDS.exe is not at the ZIP root"
            }
          }
          finally {
            $archive.Dispose()
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Upload validated Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDS-0.6.2-windows-x64
          path: |
            DDS-0.6.2-windows-x64.zip
            DDS-0.6.2-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-0-6-2:
    name: Publish v0.6.2 public preview
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publish v0.6.2 public preview'
    needs: test-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DDS-0.6.2-windows-x64
          path: release-artifacts

      - name: Move v0.6.2 tag to validated release commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -fa v0.6.2 "$env:GITHUB_SHA" -m "DDS Companion v0.6.2 — Public Preview"
          git push --force origin refs/tags/v0.6.2

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Resolve-Path "release-artifacts/DDS-0.6.2-windows-x64.zip").Path
          $sha = (Resolve-Path "release-artifacts/DDS-0.6.2-windows-x64.zip.sha256").Path

          gh release view v0.6.2 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release v0.6.2 already exists; refusing to replace it automatically"
          }

          gh release create v0.6.2 $zip $sha `
            --title "DDS Companion v0.6.2 — Public Preview" `
            --notes-file "RELEASE_NOTES_0.6.2.md" `
            --prerelease `
            --verify-tag

          $release = gh release view v0.6.2 --json tagName,name,isDraft,isPrerelease,url,assets | ConvertFrom-Json
          if ($release.tagName -ne "v0.6.2") { throw "Release tag verification failed" }
          if ($release.isDraft) { throw "Release unexpectedly remained a draft" }
          if (-not $release.isPrerelease) { throw "Release is not marked as a pre-release" }
          if (($release.assets | Measure-Object).Count -lt 2) { throw "Expected ZIP and SHA256 release assets" }
          Write-Host "Published $($release.url)"
