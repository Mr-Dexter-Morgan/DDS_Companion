name: Export Published Release Assets

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: "${{ github.event.head_commit.message == 'Export v0.7.1 release assets' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Download published v0.7.1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download v0.7.1 --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern "DDS-0.7.1-*"
          ls -lah release-assets

      - name: Upload exact release copy
        uses: actions/upload-artifact@v4
        with:
          name: DDS-v0.7.1-exact-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
