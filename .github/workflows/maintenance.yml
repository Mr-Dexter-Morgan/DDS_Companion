name: Repository Maintenance

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, 'Maintenance: cleanup Actions')
    runs-on: ubuntu-latest
    steps:
      - name: Delete archived failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 36001468393 35998270085 35996468598; do
            echo "Deleting failed run $id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
          done

      - name: Delete merged development branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/dev%2F0.7.1"
