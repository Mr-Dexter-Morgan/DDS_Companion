name: Final Actions cleanup

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run final Actions cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove archived red runs and guard maintenance CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="$GITHUB_REPOSITORY"

          for run_id in 36045154791 36044827712; do
            echo "Deleting archived red run $run_id"
            gh api -X DELETE "repos/$repo/actions/runs/$run_id" || true
          done

          echo "Waiting for Windows CI attached to maintenance commit $GITHUB_SHA"
          for i in $(seq 1 90); do
            ci_id=$(gh api "repos/$repo/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.name=="Windows CI") | .id' | head -n1)
            ci_status=$(gh api "repos/$repo/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.name=="Windows CI") | .status' | head -n1)
            ci_conclusion=$(gh api "repos/$repo/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.name=="Windows CI") | (.conclusion // "")' | head -n1)
            if [ -n "$ci_id" ] && [ "$ci_status" = "completed" ]; then
              echo "Windows CI $ci_id completed: $ci_conclusion"
              if [ "$ci_conclusion" != "success" ]; then
                gh api -X DELETE "repos/$repo/actions/runs/$ci_id" || true
              fi
              break
            fi
            sleep 10
          done

          echo "Final Actions cleanup complete"
