[project]
name = "dds-companion"
version = "0.5.8"
description = "Local archive processor and desktop dashboard for DDS — Discord Data Snatcher"
requires-python = ">=3.11"
authors = [
  {name = "Mr_Dexter_Morgan"},
  {name = "Masya"}
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[project.scripts]
dds-companion = "dds_companion.app:main"
dds-companion-gui = "dds_companion.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
